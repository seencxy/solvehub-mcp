name: publish registry

on:
  push:
    branches: [main]
    paths:
      - server.json
      - .github/workflows/publish-registry.yml
  workflow_dispatch:

env:
  MCP_PUBLISHER_VERSION: v1.8.8

jobs:
  registry:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Download mcp-publisher
        run: |
          set -uo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          code="$(curl -sS --location --retry 5 --retry-all-errors --retry-delay 2 --output "$archive" --write-out '%{http_code}' "$base/$archive")"
          echo "download status: $code"
          if [ "$code" != "200" ]; then echo "::error::download of $base/$archive returned HTTP $code"; exit 1; fi
          tar xzf "$archive" mcp-publisher
          chmod +x mcp-publisher

      - name: Authenticate with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish to the MCP Registry
        run: ./mcp-publisher publish
