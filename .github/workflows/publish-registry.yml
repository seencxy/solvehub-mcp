name: publish registry

on:
  push:
    branches: [main]
    paths:
      - server.json
      - .github/workflows/publish-registry.yml
  workflow_dispatch:

jobs:
  registry:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Download mcp-publisher
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          version="$(curl -fsSL https://api.github.com/repos/modelcontextprotocol/registry/releases/latest | sed -n 's/.*"tag_name": *"\([^"]*\)".*/\1/p' | head -1)"
          echo "mcp-publisher ${version}"
          curl -fsSL -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/${version}/mcp-publisher_${os}_${arch}.tar.gz"
          tar xzf mcp-publisher.tar.gz mcp-publisher

      - name: Authenticate with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish to the MCP Registry
        run: ./mcp-publisher publish
